<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Rayven</title>
	<meta
		name="description"
		content="Rayven eSports mit einem responsiven Header, Sprachumschaltung und mobilem Menü."
	>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@500;600;700&display=swap"
		rel="stylesheet"
	>
	<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
	<div class="page-shell">
		<header class="site-header" data-header>
			<div class="header-inner">
				<div class="header-branding">
					<button
						class="menu-toggle"
						type="button"
						aria-label="Menü öffnen"
						aria-expanded="false"
						aria-controls="mobile-menu"
						data-menu-toggle
					>
						<span class="menu-icon menu-icon-equal" data-menu-icon-open>
							<i data-lucide="equal"></i>
						</span>
						<span class="menu-icon menu-icon-close" data-menu-icon-close>
							<i data-lucide="x"></i>
						</span>
					</button>

					<a class="brand-mark" href="#start" aria-label="Rayven Startseite">
						<img src="assets/logo/logo.svg" alt="Rayven Logo">
					</a>
				</div>

				<div class="header-actions">
					<div class="language-switcher" data-language-switcher>
						<button
							class="language-trigger"
							type="button"
							aria-haspopup="true"
							aria-expanded="false"
							aria-label="Sprache auswählen"
							data-language-trigger
						>
							<span data-current-language>DE</span>
							<i data-lucide="chevron-down"></i>
						</button>
						<div class="language-menu" role="menu" aria-label="Sprachauswahl">
							<button type="button" class="is-active" data-language="de">DE</button>
							<button type="button" data-language="en">EN</button>
						</div>
					</div>
				</div>
			</div>
		</header>

		<section class="menu-panel" id="mobile-menu" aria-hidden="true" data-mobile-menu>
			<nav class="mobile-nav" aria-label="Hauptnavigation">
				<a href="#" data-i18n="nav.home">START</a>
				<a href="#" data-i18n="nav.about">ÜBER</a>
				<a href="#" data-i18n="nav.team">TEAM</a>
				<a href="#" data-i18n="nav.sponsors">SPONSOREN</a>
			</nav>
		</section>

		<main>
			<section class="hero" id="start" data-hero>
				<div class="hero-backdrop"></div>
				<div class="hero-content">
					<p class="eyebrow">Rayven eSports</p>
				</div>
			</section>
		</main>

		<footer class="site-footer">
			<nav class="footer-nav" aria-label="Footer Navigation">
				<a href="#" data-i18n="footer.socials">SOZIALES</a>
				<a href="#" data-i18n="footer.contact">KONTAKT</a>
				<a href="#" data-i18n="footer.imprint">IMPRESSUM</a>
				<a href="#" data-i18n="footer.legal">RECHTLICHES</a>
			</nav>
		</footer>
	</div>

	<script src="https://unpkg.com/lucide@latest"></script>
	<script src="assets/js/main.js"></script>
</body>
</html>
